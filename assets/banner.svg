<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5865F2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3C45A5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#43B581;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#43B581;stop-opacity:0" />
    </linearGradient>
  </defs>
  
  <!-- Base background -->
  <rect width="1200" height="300" fill="url(#bgGradient)"/>
  
  <!-- Accent overlay -->
  <rect width="1200" height="300" fill="url(#accentGradient)"/>
  
  <!-- Decorative circles background (subtle) -->
  <circle cx="150" cy="80" r="60" fill="#FFFFFF" opacity="0.05"/>
  <circle cx="1050" cy="220" r="80" fill="#FFFFFF" opacity="0.05"/>
  
  <!-- Left side: Shield icon -->
  <g transform="translate(80, 150)">
    <path d="M 0 -50 L 40 -30 L 40 10 Q 40 50 0 70 Q -40 50 -40 10 L -40 -30 Z" 
          fill="none" stroke="#43B581" stroke-width="3"/>
    <path d="M -20 5 L -5 20 L 25 -10" 
          stroke="#43B581" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Main text -->
  <text x="600" y="120" font-family="Arial, sans-serif" font-size="56" font-weight="bold" 
        text-anchor="middle" fill="#FFFFFF">
    Authentik Discord Bot
  </text>
  
  <text x="600" y="180" font-family="Arial, sans-serif" font-size="24" 
        text-anchor="middle" fill="#E0E7FF" opacity="0.9">
    Secure Invitations • Identity Management • Easy Integration
  </text>
  
  <!-- Right side: Decorative elements -->
  <g transform="translate(1100, 150)">
    <!-- Stylized link/chain icon -->
    <circle cx="0" cy="-20" r="12" fill="none" stroke="#43B581" stroke-width="2"/>
    <circle cx="0" cy="20" r="12" fill="none" stroke="#43B581" stroke-width="2"/>
    <line x1="0" y1="-8" x2="0" y2="8" stroke="#43B581" stroke-width="2"/>
  </g>
  
  <!-- Bottom accent line -->
  <rect y="280" width="1200" height="20" fill="#43B581" opacity="0.3"/>
</svg>
