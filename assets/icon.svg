<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#5865F2" stroke="#3C45A5" stroke-width="2"/>
  
  <!-- Outer ring accent -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="#43B581" stroke-width="3" opacity="0.6"/>
  
  <!-- Discord-style rounded square background -->
  <rect x="45" y="45" width="110" height="110" rx="25" fill="#FFFFFF" opacity="0.95"/>
  
  <!-- Shield shape (security/identity) -->
  <path d="M 100 60 L 130 75 L 130 105 Q 130 130 100 145 Q 70 130 70 105 L 70 75 Z" 
        fill="#5865F2" stroke="#3C45A5" stroke-width="2"/>
  
  <!-- Checkmark (validation/invite) -->
  <g transform="translate(100, 100)">
    <path d="M -15 -5 L -5 5 L 15 -15" 
          stroke="#43B581" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Decorative elements - small circles suggesting connectivity -->
  <circle cx="55" cy="55" r="4" fill="#43B581" opacity="0.7"/>
  <circle cx="145" cy="55" r="4" fill="#43B581" opacity="0.7"/>
  <circle cx="55" cy="145" r="4" fill="#43B581" opacity="0.7"/>
  <circle cx="145" cy="145" r="4" fill="#43B581" opacity="0.7"/>
</svg>
